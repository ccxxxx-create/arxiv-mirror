name: Fetch arXiv Papers

on:
  schedule:
    # 每天 09:00（北京时间，UTC+8）
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch arXiv papers
        run: python fetch_arxiv.py

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arxiv/latest.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update arxiv latest"
            git push
          fi
